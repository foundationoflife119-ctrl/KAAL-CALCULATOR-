<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="landing" class="landing">

  <div class="logo">Calculator</div>

  <div class="tagline">Fast • Accurate • Simple</div>

</div>

<div id="app" class="app hidden">

  <div class="calculator">

    <div class="display">

      <div id="history"></div>

      <div id="result">0</div>

    </div>

    <div class="buttons">

      <button class="function">AC</button>

      <button class="function">DEL</button>

      <button class="function">%</button>

      <button class="operator">÷</button>

      <button>7</button>

      <button>8</button>

      <button>9</button>

      <button class="operator">×</button>

      <button>4</button>

      <button>5</button>

      <button>6</button>

      <button class="operator">−</button>

      <button>1</button>

      <button>2</button>

      <button>3</button>

      <button class="operator">+</button>

      <button class="zero">0</button>

      <button>.</button>

      <button class="equal">=</button>

    </div>

  </div>

</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
